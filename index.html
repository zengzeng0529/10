<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>濟州島生日遊 行程助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Zen Maru Gothic', system-ui, -apple-system, sans-serif;
            background-color: #F4F8F5; /* 濟州島海島淡綠偏白底色 */
            -webkit-tap-highlight-color: transparent;
        }
        .cute-card {
            border-radius: 24px;
            border: 3px solid #EBF2ED;
            box-shadow: 0 8px 0px #E1EBE4;
            background: #FFFFFF;
        }
        /* 隱藏滾動條但保有滑動功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .strike-through {
            text-decoration: line-through;
            opacity: 0.4;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jejuOrange: '#FF7A38',       /* 主色：柑橘橘 */
                        jejuLightOrange: '#FFF4EE',  /* 襯底淡橘 */
                        jejuGreen: '#5A9367',        /* 配色：石頭爺爺綠葉綠 */
                        jejuLightGreen: '#EDF4EE',    /* 襯底淡綠 */
                        jejuWhite: '#FAFAFA'         /* 雪白 */
                    }
                }
            }
        }
    </script>
</head>
